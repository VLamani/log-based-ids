
# Log-Based Intrusion Detection System Configuration

detection:
  brute_force:
    threshold: 10
    window_seconds: 300
    severity: High

  password_spraying:
    threshold: 5
    window_seconds: 600
    severity: High

  compromise_indicator:
    threshold: 5
    window_seconds: 600
    severity: Critical

  scanning:
    threshold: 30
    window_seconds: 60
    severity: Medium

  port_scan:
    threshold: 15
    window_seconds: 60
    severity: High

  unauthorized_access:
    threshold: 10
    window_seconds: 60
    severity: High

alert_cooldown_seconds: 300

allowlist:
  ips: []
